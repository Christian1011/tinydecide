# Publishes to npm when a version tag is pushed, with provenance, through npm trusted publishing
# (no token): configure it once at npmjs.com → tinydecide → Settings → Trusted publishing.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
