# Publishes to npm when a version tag is pushed, with provenance, through npm trusted publishing
# (no token): configure it once at npmjs.com → tinydecide → Settings → Trusted publishing.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Publish unless this version is already on npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "tinydecide@$v" version > /dev/null 2>&1; then
            echo "tinydecide@$v is already on npm"
          else
            npm publish --provenance --access public
          fi
